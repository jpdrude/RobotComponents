site_name: Robot Components Learning Wiki
site_description: Tutorials and reference for Robot Components (ABB) in Grasshopper, including the advanced RAPID features of the jpdrude fork.
site_url: https://jpdrude.github.io/RobotComponents/
repo_url: https://github.com/jpdrude/RobotComponents
repo_name: jpdrude/RobotComponents
edit_uri: edit/main/docs/
copyright: Wiki text and examples are GPL-3.0 like the code. ABB and RAPID are trademarks of ABB; ABB manuals are linked, never copied.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: blue grey
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: blue grey
      toggle: { icon: material/weather-sunny, name: Light mode }

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.tasklist: { custom_checkbox: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: [docs/includes]
      auto_append: [abb-links.md]
      check_paths: true

exclude_docs: |
  /includes/
  /data/

hooks:
  - tools/docs/rc_links.py

nav:
  - Home: index.md
  - Getting started: getting-started/index.md
  - "Part A: Essentials":
      - part-a/index.md
      - "A1 Cell setup":
          - Robot Preset: part-a/a1-cell-setup/robot-preset.md
          - Robot Tool: part-a/a1-cell-setup/robot-tool.md
          - Work Object: part-a/a1-cell-setup/work-object.md
      - "A2 Targets":
          - Robot Target: part-a/a2-targets/robot-target.md
          - Robot Joint Position: part-a/a2-targets/robot-joint-position.md
          - Joint Target: part-a/a2-targets/joint-target.md
      - "A3 Motion":
          - part-a/a3-motion/index.md
          - Move: part-a/a3-motion/move.md
          - Speed Data: part-a/a3-motion/speed-data.md
          - Zone Data: part-a/a3-motion/zone-data.md
      - "A4 I/O and timing":
          - Set outputs: part-a/a4-io-and-timing/set-outputs.md
          - Wait for signals: part-a/a4-io-and-timing/wait-for-signals.md
          - Wait Time: part-a/a4-io-and-timing/wait-time.md
      - "A5 Simulation":
          - Path Generator: part-a/a5-simulation/path-generator.md
      - "A6 Generate and run":
          - RAPID Generator: part-a/a6-generate-and-run/rapid-generator.md
  - "Part B: Advanced RAPID":
      - part-b/index.md
      - "B0 RAPID primer": part-b/b0-rapid-primer.md
      - "B1 Routines":
          - Routine: part-b/b1-routines/routine.md
          - Routine Argument: part-b/b1-routines/routine-argument.md
          - Routine Call: part-b/b1-routines/routine-call.md
          - Return: part-b/b1-routines/return.md
      - "B2 Data and expressions":
          - RAPID Variable: part-b/b2-data/rapid-variable.md
          - Assign Variable Value: part-b/b2-data/assign-variable-value.md
          - Comparison Expression: part-b/b2-data/comparison-expression.md
      - "B3 Flow control":
          - For Loop: part-b/b3-flow-control/for-loop.md
          - While Loop: part-b/b3-flow-control/while-loop.md
          - IF Statement: part-b/b3-flow-control/if-statement.md
      - "B4 Target arithmetic":
          - Offset Target: part-b/b4-target-arithmetic/offset-target.md
          - Current Robot Target: part-b/b4-target-arithmetic/current-robot-target.md
          - Get Robtarget Members: part-b/b4-target-arithmetic/get-robtarget-members.md
      - "B5 Operator interaction":
          - Message Box: part-b/b5-operator-interaction/message-box.md
          - Numeric Entry Box: part-b/b5-operator-interaction/numeric-entry-box.md
      - "B6 Interrupts":
          - Connect Interrupt: part-b/b6-interrupts/connect-interrupt.md
      - "B7 Raw code":
          - Code: part-b/b7-raw-code/code.md
      - "B8 Tutorials":
          - "A row of points with a loop": part-b/b8-tutorials/row-loop.md
  - Reference:
      - ABB manuals: reference/abb-manuals.md
      - Page template: reference/page-template.md
