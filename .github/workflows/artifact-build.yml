name: Build Artifacts (On-Demand)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore

      - name: Build solution
        run: msbuild /t:Restore,Build /p:Configuration=${{ inputs.configuration }}

      - name: Setup VSTest
        uses: Malcolmnixon/Setup-VSTest@v4

      - name: Run tests
        run: vstest.console.exe "RobotComponents.Tests\bin\${{ inputs.configuration }}\net48\RobotComponents.Tests.dll" /TestCaseFilter:"Category!=RequiresRhino" /Logger:"trx;LogFileName=TestResults.trx"

      - name: Collect plugin files
        shell: pwsh
        run: >
          .\.github\scripts\Collect-ReleaseFiles.ps1
          -Configuration "${{ inputs.configuration }}"
          -OutputDir artifact-staging

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobotComponents-${{ inputs.configuration }}-${{ github.sha }}
          path: artifact-staging/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults.trx'
