# Chapter exercises, appended to the chapter landing pages by tools/docs/make_chapter_indexes.py.
# level: 1 = basic, 2 = combine, 3 = open. Solutions must only use behaviour verified in the wiki.

part-a/a1-cell-setup:
  - level: 1
    task: "Give the [first program](../../getting-started/index.md) a pen: a [[Robot Tool]] whose tip is 120 mm along the flange's Z axis. Which parts of the RAPID change?"
    solution: "Every Move line now says `pen` instead of `tool0`, and (with right-click → *Add Tool Data* on the [[RAPID Generator]]) a `PERS tooldata pen := [TRUE, [[0, 0, 120], …]` declaration appears. The targets stay the same: they describe where the **pen tip** goes, so the flange now stops 120 mm higher."
  - level: 2
    task: "In the [[Work Object]] example, move the table 100 mm further in X. Which numbers in the RAPID change?"
    solution: "Only the object frame inside `wobjdata table` (`[[450, -150, 150], …]`). The four robtargets stay `[0, 0, 0]`, `[100, 0, 0]`, … because they are relative to the table, which is the point of a work object."

part-a/a2-targets:
  - level: 1
    task: "In the first program, replace [[Flip Plane X]] by [[Flip Plane Y]]. Does the tool still point down? What changes in the robtarget?"
    solution: "Yes, the Z axis still points down. Only the orientation changes: Flip Plane Y turns the plane 180° about its X axis instead of its Y axis, so the quaternion (second block of the robtarget) is different and the wrist is turned by 180° around the tool axis."
  - level: 2
    task: "Use [[Inverse Kinematics]] to turn the first program's target into joint angles, and use those as the start pose of a [[abb:MoveAbsJ]]."
    solution: "Wire the IK's *Robot Joint Position* output into a [[Move]] with type `MoveAbsJ`. For the target (400, 0, 400) the joint angles are `[0, 14.63, 41.4, 0, 33.97, 0]`; see [[Inverse Kinematics]]."

part-a/a3-motion:
  - level: 1
    task: "In the [[Move]] square, give **every** corner the zone `fine`. How does the motion change?"
    solution: "The robot stops exactly on each corner instead of rounding it, so the square has sharp corners and takes longer. Use `fine` where the robot must really be on the point."
  - level: 2
    task: "Drive the last edge of the square at `v50` and the others at `v200`."
    solution: "Like the zones in the Move page's Task 2: a [[gh:Panel]] with four lines `200`, `200`, `200`, `50` on *Speed Data*. Grasshopper matches one speed to each target, and numbers are turned into the nearest predefined speed."

part-a/a4-io-and-timing:
  - level: 1
    task: "In [pick and place](../a9-tutorials/pick-and-place.md) the gripper gets 0.5 s to close. Make it 1 s, but only for closing."
    solution: "Give the first [[Wait Time]] (after `SetDO doGripper, 1;`) a *Duration* of `1`, and keep the second one at `0.5`."
  - level: 2
    task: "Close the gripper **exactly** when the robot arrives at `pick`, without a separate Set Digital Output line."
    solution: "Right-click the Move to `pick` → *Set Digital Output*, and wire a [[Set Digital Output]] (`doGripper`, `1`) into it. The Move becomes a [[abb:MoveLDO]], which switches the output at the target."

part-a/a5-simulation:
  - level: 1
    task: "Add a [[Path Generator]] to the [pick and place](../a9-tutorials/pick-and-place.md) definition and scrub the slider. Where does the robot move fastest?"
    solution: "On the two [[abb:MoveJ]] moves across (`v200`, joint interpolation). The [[abb:MoveL]] moves near the parts run at `v50`."
  - level: 2
    task: "Compare the *Program Time* of the [[Path Generator]] and the [[Timed Path Generator]] for the [[Move]] square with the 6.2 s measured on the Virtual Controller."
    solution: "Both are estimates from path length and programmed speed (the Path Generator gave 5.8 s). The controller is slower because it accelerates, decelerates and rounds corners. Use the estimates to compare variants, not as exact cycle times."

part-b/b1-routines:
  - level: 1
    task: "In the [[Routine]] example, rename the routine from `visit` to `touch`. Which lines change?"
    solution: "The routine header `PROC touch(num y)` and the two calls `touch -150;` / `touch 150;`. Change the name in the one [[gh:Panel]] that feeds both the Routine and the [[Routine Call]]."
  - level: 2
    task: "Turn the approach height of `visit` into a second argument and call it with 100 and 50."
    solution: "Click **+** on the [[Routine]] and add a [[Routine Argument]] `num h`; use its *Variable* for *Z* of the upper [[Offset Target]]. Click **+** on the [[Routine Call]] for *Argument Value 2*. The routine becomes `PROC visit(num y, num h)` and the calls `visit -150, 100;` etc."

part-b/b2-data:
  - level: 1
    task: "Declare a `PERS num cycles := 0;` and count program runs with it."
    solution: "[[RAPID Variable]] with Keyword `PERS`, Type [[abb:num]], Name `cycles`, Value `0`; its *Variable Declaration* into *Actions*. An [[Assign Variable Value]] `cycles + 1` once in `main` (not inside a loop)."
  - level: 2
    task: "Reset the counter from the [row tutorial](../b8-tutorials/row-loop.md) at 50 instead of 100, using `=` instead of `>=`. Why is `>=` the safer choice?"
    solution: "Operator `=`, B `50`. `>=` also resets if the counter ever jumps past the limit (e.g. after the limit was changed), while `=` would then never reset."

part-b/b3-flow-control:
  - level: 1
    task: "Make the [row tutorial](../b8-tutorials/row-loop.md) visit its points in reverse order."
    solution: "*From* `3`, *To* `0`. RAPID's FOR counts down by itself when *From* > *To* (checked on the Virtual Controller)."
  - level: 2
    task: "Repeat the row until the operator says stop, instead of a fixed number of times."
    solution: "Wrap the row in a [[While Loop]] with a [[abb:bool]] condition and end it from a [[Message Box]], as in the [operator loop](../b5-operator-interaction/message-box.md). Remember to wire something into **every** button."
